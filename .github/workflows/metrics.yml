name: Metrics

on:
  # Her gün 03:00 UTC (Türkiye saatiyle 06:00)
  schedule:
    - cron: "0 3 * * *"
  # Actions sekmesinden elle çalıştırmak için
  workflow_dispatch:
  # README değiştiğinde de yenile (SVG commit'leri tetiklemez)
  push:
    branches: ["main"]
    paths-ignore:
      - "metrics.*.svg"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Genel istatistikler
      - name: General
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: metinncetinn
          filename: metrics.general.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Istanbul

      # 2) Isometric katkı takvimi
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: metinncetinn
          filename: metrics.isometric.svg
          template: classic
          base: ""
          config_timezone: Europe/Istanbul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3) En çok kullanılan diller
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: metinncetinn
          filename: metrics.languages.svg
          template: classic
          base: ""
          config_timezone: Europe/Istanbul
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # 4) Öne çıkan repolar (profildeki pinli repolar)
      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: metinncetinn
          filename: metrics.repositories.svg
          template: classic
          base: ""
          config_timezone: Europe/Istanbul
          plugin_repositories: yes
          plugin_repositories_pinned: 6
